<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career-Ops</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="stylesheet" href="static/shell.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__blob ambient__blob--1"></div>
    <div class="ambient__blob ambient__blob--2"></div>
    <div class="ambient__grid"></div>
  </div>

  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="sidebar__inner">
        <div class="sidebar__brand">
          <span class="sidebar__logo">CO</span>
          <div>
            <div class="sidebar__name">Career-Ops</div>
            <div class="sidebar__tag" id="sidebarVersion">Job search</div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="sidebar-nav__group">
            <span class="sidebar-nav__label">Home</span>
            <button type="button" class="sidebar-nav__item is-active" data-panel="overview">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
              <span class="sidebar-nav__label-text">Overview</span>
            </button>
          </div>
          <div class="sidebar-nav__group">
            <span class="sidebar-nav__label">Jobs</span>
            <button type="button" class="sidebar-nav__item" data-panel="inbox">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 12H2l3-7h14l3 7z"/><path d="M5 12v7h14v-7"/></svg></span>
              <span class="sidebar-nav__label-text">Inbox</span>
            </button>
            <button type="button" class="sidebar-nav__item" data-panel="applications">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>
              <span class="sidebar-nav__label-text">Applications</span>
            </button>
          </div>
          <div class="sidebar-nav__group">
            <span class="sidebar-nav__label">Insights</span>
            <button type="button" class="sidebar-nav__item" data-panel="reports">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
              <span class="sidebar-nav__label-text">Reports</span>
            </button>
            <button type="button" class="sidebar-nav__item" data-panel="patterns">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 5 5-9"/></svg></span>
              <span class="sidebar-nav__label-text">Patterns</span>
            </button>
            <button type="button" class="sidebar-nav__item" data-panel="followups">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
              <span class="sidebar-nav__label-text">Follow-ups</span>
            </button>
            <button type="button" class="sidebar-nav__item" data-panel="interviewprep">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
              <span class="sidebar-nav__label-text">Interview prep</span>
            </button>
          </div>
          <div class="sidebar-nav__group">
            <span class="sidebar-nav__label">Sources</span>
            <button type="button" class="sidebar-nav__item" data-panel="discovery">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>
              <span class="sidebar-nav__label-text">Discovery</span>
            </button>
            <button type="button" class="sidebar-nav__item" data-panel="linkedin">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-13h4v2"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></span>
              <span class="sidebar-nav__label-text">LinkedIn</span>
            </button>
          </div>
          <div class="sidebar-nav__group">
            <span class="sidebar-nav__label">You</span>
            <button type="button" class="sidebar-nav__item" data-panel="profile">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/></svg></span>
              <span class="sidebar-nav__label-text">Profile</span>
            </button>
          </div>
          <div class="sidebar-nav__group">
            <span class="sidebar-nav__label">Help</span>
            <button type="button" class="sidebar-nav__item" data-panel="workflow">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16"/></svg></span>
              <span class="sidebar-nav__label-text">How it works</span>
            </button>
            <button type="button" class="sidebar-nav__item" data-panel="commands">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></span>
              <span class="sidebar-nav__label-text">AI commands</span>
            </button>
            <button type="button" class="sidebar-nav__item" data-panel="runs">
              <span class="sidebar-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
              <span class="sidebar-nav__label-text">Maintenance</span>
            </button>
          </div>
        </nav>

        <p class="sidebar__footer">Use <kbd>Refresh</kbd> to sync after working in your AI assistant.</p>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div>
          <h1 class="topbar__title" id="topbarTitle">Overview</h1>
          <p class="topbar__meta" id="topbarMeta">Home · Career-Ops</p>
        </div>
        <div class="topbar__actions">
          <button type="button" class="btn btn--ghost" id="btnRefresh">Refresh</button>
        </div>
      </header>

      <main class="main-scroll">
        <section id="mainOverview" class="main-view is-active" aria-label="Overview">
          <div id="overviewRoot"></div>
        </section>
        <section id="mainInbox" class="main-view" aria-label="Inbox" hidden>
          <div id="inboxRoot"></div>
        </section>
        <section id="mainApplications" class="main-view" aria-label="Applications" hidden>
          <div id="applicationsRoot"></div>
        </section>
        <section id="mainReports" class="main-view" aria-label="Reports" hidden>
          <div id="reportsRoot"></div>
        </section>
        <section id="mainPatterns" class="main-view" aria-label="Patterns" hidden>
          <div id="patternsRoot"></div>
        </section>
        <section id="mainFollowups" class="main-view" aria-label="Follow-ups" hidden>
          <div id="followupsRoot"></div>
        </section>
        <section id="mainInterviewprep" class="main-view" aria-label="Interview prep" hidden>
          <div id="interviewPrepRoot"></div>
        </section>
        <section id="mainDiscovery" class="main-view main-view--discovery" aria-label="Discovery" hidden>
          <div id="discoveryRoot"></div>
        </section>
        <section id="mainLinkedin" class="main-view" aria-label="LinkedIn" hidden>
          <div id="linkedinRoot"></div>
        </section>
        <section id="mainProfile" class="main-view" aria-label="Profile" hidden>
          <div id="profileRoot"></div>
        </section>
        <section id="mainWorkflow" class="main-view" aria-label="How it works" hidden>
          <div id="workflowRoot"></div>
        </section>
        <section id="mainCommands" class="main-view" aria-label="AI commands" hidden>
          <div id="commandsRoot"></div>
        </section>
        <section id="mainRuns" class="main-view" aria-label="Maintenance" hidden>
          <div id="runsRoot"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="pdfModal" class="pdf-modal" hidden aria-hidden="true">
    <div class="pdf-modal__backdrop" data-close-pdf></div>
    <div class="pdf-modal__panel glass-card" role="dialog" aria-labelledby="pdfModalTitle">
      <header class="pdf-modal__header">
        <h2 id="pdfModalTitle" class="pdf-modal__title">Resume PDF</h2>
        <div class="pdf-modal__actions">
          <a id="pdfModalOpen" class="btn btn--sm btn--ghost" href="#" target="_blank" rel="noopener">Open tab</a>
          <button type="button" class="btn btn--sm" data-close-pdf aria-label="Close">Close</button>
        </div>
      </header>
      <iframe id="pdfModalFrame" class="pdf-modal__frame" title="PDF preview"></iframe>
    </div>
  </div>

  <div id="applyModal" class="pdf-modal" hidden aria-hidden="true">
    <div class="pdf-modal__backdrop" data-close-apply></div>
    <div class="pdf-modal__panel glass-card pdf-modal__panel--wide" role="dialog" aria-labelledby="applyModalTitle">
      <header class="pdf-modal__header">
        <h2 id="applyModalTitle" class="pdf-modal__title">Application answers</h2>
        <div class="pdf-modal__actions">
          <button type="button" class="btn btn--sm" data-close-apply aria-label="Close">Close</button>
        </div>
      </header>
      <div id="applyModalBody" class="apply-modal__body"></div>
    </div>
  </div>

  <script src="static/vendor/marked.min.js"></script>
  <script src="static/lib/user-copy.js"></script>
  <script src="static/lib/report-summary.js"></script>
  <script src="static/util.js"></script>
  <script src="static/lib/config-forms.js"></script>
  <script src="static/modules/panels/workflow.js"></script>
  <script src="static/modules/panels/commands.js"></script>
  <script src="static/modules/panels/overview.js"></script>
  <script src="static/modules/panels/inbox.js"></script>
  <script src="static/modules/panels/applications.js"></script>
  <script src="static/modules/panels/reports.js"></script>
  <script src="static/modules/panels/patterns.js"></script>
  <script src="static/modules/panels/followups.js"></script>
  <script src="static/modules/panels/interview-prep.js"></script>
  <script src="static/modules/panels/discovery.js"></script>
  <script src="static/modules/panels/linkedin.js"></script>
  <script src="static/modules/panels/profile.js"></script>
  <script src="static/modules/panels/runs.js"></script>
  <script src="static/router.js"></script>
  <script src="static/boot.js"></script>
</body>
</html>
